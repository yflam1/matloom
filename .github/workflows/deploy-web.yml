name: Deploy frontend/ (project page + viewer) to GitHub Pages

on:
  push:
    branches: [main]
    # Only rebuild when the web site (or this workflow) changes.
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # One build, two HTML entries: the paper project page (dist/index.html,
      # served at the Pages root) and the interactive viewer (dist/viewer/,
      # served under /viewer/).
      - name: Build (type-check, bundle, obfuscate)
        run: npm run build
      # --- Deploy gates: a build that compiles is not a build that runs.
      #     These two checks (commit 88dfd82's class of bug — a leaked Vite
      #     worker-asset placeholder 404'ing the eval pool at runtime — passed
      #     `vite build` green and shipped a broken site) must pass BEFORE the
      #     Pages artifact is uploaded. Failing either blocks the deploy.
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('frontend/package-lock.json') }}
      - name: Static build-artifact check (no leaked placeholders)
        run: npm run build:check
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Runtime smoke test (boots dist/, gates deploy)
        run: npm run test:smoke
      - name: Upload smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-smoke-${{ github.run_id }}
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
